name: blog

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
      - app_var:/var/www/var
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - my_network

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www
      - app_var:/var/www/var
    depends_on:
      - php
    networks:
      - my_network

  # Мастер
  db_master:
    image: mysql:8.0
    command: [
      "--server-id=1",
      "--log-bin=mysql-bin",
      "--binlog-format=ROW",
      "--gtid-mode=ON",                  # ВКЛЮЧАЕМ GTID
      "--enforce-gtid-consistency=ON",    # СТРОГАЯ КОНСИСТЕНТНОСТЬ
      "--log-replica-updates=ON"         # ЛОГИРОВАНИЕ ДЛЯ РЕПЛИК
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD is required in .env}
      MYSQL_DATABASE: ${DB_NAME:?Error - DB_NAME is required in .env}
      MYSQL_USER: ${DB_USER:?Error - DB_USER is required in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD is required in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./init-master.sql:/docker-entrypoint-initdb.d/init-master.sql
    networks:
      - my_network
      
  db_slave:
    image: mysql:8.0
    command: [
      "--server-id=2",
      "--relay-log=mysql-relay-bin",
      "--read-only=ON",
      "--gtid-mode=ON",
      "--enforce-gtid-consistency=ON",
      "--log-replica-updates=ON"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD is required in .env}
      MYSQL_DATABASE: ${DB_NAME:?Error - DB_NAME is required in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
      # МАППИМ НАШ БАШ-СКРИПТ:
      - ./init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh
    depends_on:
      - db_master
    networks:
      - my_network

  redis:
    image: redis:7.2
    ports:
      - "${REDIS_PORT:?Error - REDIS_PORT is required in .env}:6379"
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  mysql_master_data: # Переименовал, чтобы не мешать старым ассетам
  mysql_slave_data:
  app_var:

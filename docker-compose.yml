name: blog

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
      - smarty_cache:/var/www/var/smarty
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - my_network

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www
      - smarty_cache:/var/www/var/smarty
    depends_on:
      - php
    networks:
      - my_network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD is required in .env}
      MYSQL_DATABASE: ${DB_NAME:?Error - DB_NAME is required in .env}
      MYSQL_USER: ${DB_USER:?Error - DB_USER is required in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Error - DB_PASSWORD is required in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my_network

  redis:
    image: redis:7.2
    ports:
      - "${REDIS_PORT:?Error - REDIS_PORT is required in .env}:6379"
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  mysql_data:
  smarty_cache:
